# Kern on Coolify.
#
# The same stack as ../docker-compose.yml with the parts that assume a bare host taken out. Coolify
# owns ports 80 and 443, issues the certificate and keeps the environment itself, so this file:
#
#   * publishes no ports — Coolify's proxy reaches Caddy over the Docker network;
#   * writes Caddy's config from inside the container, because a Compose file pasted into Coolify
#     has no files next to it to mount;
#   * takes every secret from a Coolify magic variable, so there is nothing to generate by hand;
#   * derives every URL from the domain Coolify assigns, so changing the domain is one edit.
#
# Kern still runs its own Caddy. That is what turns one domain into six services — /api to core,
# /api/chat and /ws to chat, /collab to collab, /s3 to MinIO, the rest to the app. Doing that from
# Coolify's proxy would mean six domains or six sets of labels.
#
# Deploy it as a Docker Compose resource, either from this repository (base directory
# /selfhost/coolify) or by pasting the file:
# https://docs.kernaio.com/self-hosting/coolify/
#
# Two variables are worth setting before the first deploy, in Coolify's Environment Variables tab:
#   KERN_ADMIN_EMAIL   the first admin account. Read on the first boot only; ignored afterwards.
#   KERN_VERSION       pin a release instead of following `latest`.

x-kern-env: &kern-env
  NODE_ENV: production
  KERN_BASE_URL: ${SERVICE_URL_CADDY}
  KERN_SECRET: ${SERVICE_BASE64_64_KERNSECRET}
  DATABASE_URL: postgres://kern:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kern
  NATS_URL: nats://nats:4222
  VALKEY_URL: redis://valkey:6379
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${SERVICE_URL_CADDY}/s3
  S3_REGION: us-east-1
  S3_BUCKET: kern
  S3_ACCESS_KEY: kern
  S3_SECRET_KEY: ${SERVICE_PASSWORD_MINIO}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-Kern <no-reply@localhost>}
  BETTER_AUTH_SECRET: ${SERVICE_BASE64_64_AUTHSECRET}
  BETTER_AUTH_URL: ${SERVICE_URL_CADDY}
  CORE_URL: http://core:4000
  CHAT_URL: http://chat:4100
  MAIL_URL: http://mail:4200
  COLLAB_URL: http://collab:4300
  # Calls need a LiveKit server with its own UDP ports, which is not something Coolify's proxy can
  # front. Point these at a LiveKit you run separately, or leave them alone and calls stay off.
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  # Billing. Empty on a normal install: the module ships in the image and does nothing until an
  # instance both defines plans and sets a Stripe key.
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  KERN_DEFAULT_PLAN_SLUG: ${KERN_DEFAULT_PLAN_SLUG:-}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Declaring the magic variable is what makes Coolify hand this stack a domain and point its
    # proxy at port 80. Everything else reads ${SERVICE_URL_CADDY}, so the domain is set in one
    # place: Coolify -> Configuration -> Domains.
    environment:
      - SERVICE_URL_CADDY_80
    entrypoint: ["/bin/sh", "-c"]
    # Keep these routes in step with ../Caddyfile. The only differences are deliberate: the site
    # address is :80 because Coolify terminates TLS, and there is no acme block for the same reason.
    command:
      - |
        cat >/etc/caddy/Caddyfile <<'CADDYFILE'
        {
          # Coolify's proxy sits in front on a private address. Without trusting it, Caddy would
          # replace the client IP with the proxy's and rewrite X-Forwarded-Proto to http, so every
          # service behind here would believe the request arrived over plain HTTP.
          servers {
            trusted_proxies static private_ranges
          }
        }

        :80 {
          encode zstd gzip

          # realtime + chat service
          @chat path /api/chat/* /ws /ws/*
          handle @chat {
            reverse_proxy chat:4100
          }
          # mail service
          handle_path /api/mail/* {
            rewrite * /api/mail{uri}
            reverse_proxy mail:4200
          }
          # collaborative editing (Yjs)
          handle /collab* {
            reverse_proxy collab:4300
          }
          # object storage (presigned URLs)
          handle_path /s3/* {
            reverse_proxy minio:9000
          }
          # core API (auth, workspaces, all other modules) + OpenAPI
          handle /api/* {
            reverse_proxy core:4000
          }
          # web app (SvelteKit)
          handle {
            reverse_proxy app:3000
          }

          header {
            X-Content-Type-Options nosniff
            Referrer-Policy strict-origin-when-cross-origin
            Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)"
            Content-Security-Policy "frame-ancestors 'none'"
            X-Frame-Options DENY
            -Server
          }
        }
        CADDYFILE
        caddy fmt --overwrite /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on: [app, core]

  app:
    image: ghcr.io/kernaio/app:${KERN_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *kern-env
      PORT: 3000
      ORIGIN: ${SERVICE_URL_CADDY}
      PUBLIC_API_URL: ${SERVICE_URL_CADDY}
      PUBLIC_WS_URL: ${SERVICE_URL_CADDY}/ws
      PUBLIC_COLLAB_URL: ${SERVICE_URL_CADDY}/collab
    depends_on: [core]

  core:
    image: ghcr.io/kernaio/core:${KERN_VERSION:-latest}
    restart: unless-stopped
    # KERN_ADMIN_EMAIL has to be a valid address or core refuses to start, so it carries a default
    # that is obviously a placeholder. Set your own before the first deploy — after an admin exists
    # both of these are ignored, and the password is changed in the interface.
    environment:
      <<: *kern-env
      PORT: 4000
      KERN_ADMIN_EMAIL: ${KERN_ADMIN_EMAIL:-admin@example.com}
      KERN_ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }
      valkey: { condition: service_started }
      minio: { condition: service_started }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"], interval: 15s, timeout: 5s, retries: 10 }

  core-worker:
    image: ghcr.io/kernaio/core:${KERN_VERSION:-latest}
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment: *kern-env
    depends_on: { core: { condition: service_healthy } }

  chat:
    image: ghcr.io/kernaio/chat:${KERN_VERSION:-latest}
    restart: unless-stopped
    environment: { <<: *kern-env, PORT: 4100 }
    depends_on: { core: { condition: service_healthy } }

  mail:
    image: ghcr.io/kernaio/mail:${KERN_VERSION:-latest}
    restart: unless-stopped
    environment: { <<: *kern-env, PORT: 4200 }
    depends_on: { core: { condition: service_healthy } }

  collab:
    image: ghcr.io/kernaio/collab:${KERN_VERSION:-latest}
    restart: unless-stopped
    environment: { <<: *kern-env, PORT: 4300 }
    depends_on: { core: { condition: service_healthy } }

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    # No init script is mounted, unlike the host install: core's first migration creates pg_trgm,
    # pgcrypto, ltree and vector itself. The host install also creates pg_stat_statements, which
    # does nothing without shared_preload_libraries and is not created here.
    environment: { POSTGRES_USER: kern, POSTGRES_PASSWORD: "${SERVICE_PASSWORD_POSTGRES}", POSTGRES_DB: kern }
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U kern"], interval: 5s, timeout: 5s, retries: 20 }

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "--store_dir", "/data"]
    volumes: ["natsdata:/data"]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1000", "--appendonly", "no"]
    volumes: ["valkeydata:/data"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment: { MINIO_ROOT_USER: kern, MINIO_ROOT_PASSWORD: "${SERVICE_PASSWORD_MINIO}" }
    volumes: ["miniodata:/data"]

  # Runs once and exits. Nothing creates the bucket at upload time, so files fail without it.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set local http://minio:9000 kern ${SERVICE_PASSWORD_MINIO} && mc mb -p local/kern || true"

  # Office and PDF previews. Opt-in on a host install (--profile preview) and always on here, because
  # Coolify has no way to pass a profile. Nothing calls it yet — previews are not built — so today it
  # sits idle. Delete the service if you would rather not run it until they are.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

volumes: { pgdata: {}, natsdata: {}, valkeydata: {}, miniodata: {} }
