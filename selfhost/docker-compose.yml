# Kern self-host distribution. `./install.sh` prepares .env, then `docker compose up -d`.
# Optional profiles: --profile calls (LiveKit), --profile preview (Gotenberg office/PDF previews),
#                    --profile observability (GlitchTip)
name: kern
x-kern-env: &kern-env
  NODE_ENV: production
  KERN_BASE_URL: ${KERN_BASE_URL}
  KERN_SECRET: ${KERN_SECRET}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  NATS_URL: nats://nats:4222
  VALKEY_URL: redis://valkey:6379
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  SMTP_URL: ${SMTP_URL}
  MAIL_FROM: ${MAIL_FROM}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${KERN_BASE_URL}
  CORE_URL: http://core:4000
  CHAT_URL: http://chat:4100
  MAIL_URL: http://mail:4200
  COLLAB_URL: http://collab:4300
  LIVEKIT_URL: ws://livekit:7880
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
  # Billing. Empty on a normal install: the module ships in the image and does nothing until an
  # instance both defines plans and sets a Stripe key, so a self-hosted Kern has no limits at all.
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  # Slug of the plan a brand-new workspace starts on. Leave empty and new workspaces get no
  # subscription row, which resolves to unlimited.
  KERN_DEFAULT_PLAN_SLUG: ${KERN_DEFAULT_PLAN_SLUG:-}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { KERN_DOMAIN: "${KERN_DOMAIN}", ACME_EMAIL: "${ACME_EMAIL}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [app, core]

  app:
    image: ghcr.io/kernaio/app:${KERN_VERSION}
    restart: unless-stopped
    environment:
      <<: *kern-env
      PORT: 3000
      ORIGIN: ${KERN_BASE_URL}
      PUBLIC_API_URL: ${KERN_BASE_URL}
      PUBLIC_WS_URL: ${KERN_BASE_URL}/ws
      PUBLIC_COLLAB_URL: ${KERN_BASE_URL}/collab
    depends_on: [core]

  core:
    image: ghcr.io/kernaio/core:${KERN_VERSION}
    restart: unless-stopped
    environment: { <<: *kern-env, PORT: 4000, KERN_ADMIN_EMAIL: "${KERN_ADMIN_EMAIL}", KERN_ADMIN_PASSWORD: "${KERN_ADMIN_PASSWORD}" }
    depends_on: { postgres: { condition: service_healthy }, nats: { condition: service_started }, valkey: { condition: service_started }, minio: { condition: service_started } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"], interval: 15s, timeout: 5s, retries: 10 }

  core-worker:
    image: ghcr.io/kernaio/core:${KERN_VERSION}
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment: *kern-env
    depends_on: { core: { condition: service_healthy } }

  chat:
    image: ghcr.io/kernaio/chat:${KERN_VERSION}
    restart: unless-stopped
    environment: { <<: *kern-env, PORT: 4100 }
    depends_on: { core: { condition: service_healthy } }

  mail:
    image: ghcr.io/kernaio/mail:${KERN_VERSION}
    restart: unless-stopped
    environment: { <<: *kern-env, PORT: 4200 }
    depends_on: { core: { condition: service_healthy } }

  collab:
    image: ghcr.io/kernaio/collab:${KERN_VERSION}
    restart: unless-stopped
    environment: { <<: *kern-env, PORT: 4300 }
    depends_on: { core: { condition: service_healthy } }

  # Opt-in: `docker compose --profile autoupdate up -d`.
  #
  # It exists so an admin can have Kern update itself on a host with no systemd timer. Mounting the
  # Docker socket gives this container control of the whole host — a compromise of Kern becomes a
  # compromise of everything Docker runs here — so it is off unless you ask for it, and the timer in
  # `systemd/` is the better answer when you have systemd.
  #
  # Its image tag is deliberately not ${KERN_VERSION}: an upgrade must not recreate the container
  # that is running the upgrade.
  updater:
    image: docker:27-cli
    profiles: [autoupdate]
    restart: unless-stopped
    environment: { TZ: "${TZ:-UTC}" }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/kern
    working_dir: /kern
    entrypoint:
      - /bin/sh
      - -c
      - >
        apk add --no-cache bash curl python3 docker-cli-compose >/dev/null &&
        while true; do bash ./kern-upgrade.sh --auto || true; sleep 3600; done

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment: { POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB}" }
    volumes: ["pgdata:/var/lib/postgresql", "./postgres-init:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"], interval: 5s, timeout: 5s, retries: 20 }

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "--store_dir", "/data"]
    volumes: ["natsdata:/data"]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1000", "--appendonly", "no"]
    volumes: ["valkeydata:/data"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment: { MINIO_ROOT_USER: "${S3_ACCESS_KEY}", MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY}" }
    volumes: ["miniodata:/data"]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} && mc mb -p local/${S3_BUCKET} || true"

  livekit:
    image: livekit/livekit-server:latest
    profiles: [calls]
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment: { LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}" }
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    ports: ["7881:7881", "50000-50200:50000-50200/udp"]

  gotenberg:
    image: gotenberg/gotenberg:8
    profiles: [preview]
    restart: unless-stopped

volumes: { pgdata: {}, natsdata: {}, valkeydata: {}, miniodata: {}, caddy_data: {}, caddy_config: {} }
