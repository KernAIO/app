name: Release
# Cuts one platform version out of whatever landed on main since the last one.
#
# Kern releases as a single platform: every image and every module moves together under one
# KERN_VERSION, so a release is not a per-repository act. This workflow tags the same version in
# each service repository, waits for the images that produces, and then publishes the umbrella
# release — which is what `release-feed.yml` signs a feed from and what rolls the cloud forward.
#
# It runs nightly because main moves all day. Batching a day's work into one version is what keeps
# a version number meaningful: an admin on 0.4.0 knows exactly which module versions they have.
# Releasing per push would produce a number per commit and tell them nothing.
on:
  schedule:
    # 02:00 UTC — after the day's pushes, before anyone is looking.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Override the bump; auto reads it from the commits'
        required: true
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      force:
        description: 'Release even if no service repository changed'
        required: false
        default: false
        type: boolean

permissions: { contents: write }
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The repositories that build an image. A release is defined by these; docs and website ship on
  # their own and carry no KERN_VERSION.
  # The repositories that build an image. `chat` and `mail` moved into the modules that need them
  # (ADR 0008): the image is still called `chat`/`mail`, but it is built from `module-chat` and
  # `module-mail`, so those are the repositories a release tags.
  SERVICES: core app module-chat module-mail collab

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Work out the previous version and the next one
        id: v
        env:
          # GITHUB_TOKEN reads this repository's releases; it cannot read the service repositories.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The fine-grained PAT is the other way round — scoped to the service repositories only.
          SERVICES_TOKEN: ${{ secrets.KERN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          PREV=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName \
                 --jq '.[0].tagName // empty' | sed 's/^v//')
          PREV=${PREV:-0.0.0}
          BUMP='${{ inputs.bump || 'auto' }}'

          # Read the bump out of the commits rather than asking anyone. The repositories are held to
          # Conventional Commits, so the information is already there: a `feat:` is a minor, a `!`
          # or a BREAKING CHANGE trailer is a major, and everything else is a patch.
          if [ "$BUMP" = "auto" ]; then
            BUMP=patch
            for repo in $SERVICES; do
              if [ "$PREV" = "0.0.0" ]; then
                LOG=$(GH_TOKEN="$SERVICES_TOKEN" gh api "/repos/KernAIO/$repo/commits?sha=main&per_page=100" --jq '.[].commit.message')
              else
                LOG=$(GH_TOKEN="$SERVICES_TOKEN" gh api "/repos/KernAIO/$repo/compare/v$PREV...main" --jq '.commits[].commit.message' 2>/dev/null || echo "")
              fi
              # A subject like `feat(core)!: ...`, or a BREAKING CHANGE trailer anywhere in the body.
              if echo "$LOG" | grep -qE '^[a-z]+(\([^)]*\))?!:' || echo "$LOG" | grep -q 'BREAKING CHANGE'; then
                BUMP=major; break
              fi
              if echo "$LOG" | grep -qE '^feat(\([^)]*\))?:'; then BUMP=minor; fi
            done
            echo "Commits since v$PREV say: $BUMP"
          fi

          IFS=. read -r MA MI PA <<< "$PREV"
          # Before 1.0.0 a breaking change is a minor, not a major. Without this the first `feat!:`
          # would quietly declare Kern 1.0.0 — a statement about stability nobody meant to make.
          if [ "$BUMP" = "major" ] && [ "$MA" = "0" ]; then
            echo "0.x: treating the breaking change as a minor rather than declaring 1.0.0."
            BUMP=minor
          fi
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          echo "prev=$PREV"   >> "$GITHUB_OUTPUT"
          echo "next=$MA.$MI.$PA" >> "$GITHUB_OUTPUT"
          echo "Previous $PREV -> next $MA.$MI.$PA ($BUMP)"

      - name: Has anything actually shipped since then?
        id: changed
        env:
          GH_TOKEN: ${{ secrets.KERN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          PREV='${{ steps.v.outputs.prev }}'
          CHANGED=false
          for repo in $SERVICES; do
            if [ "$PREV" = "0.0.0" ]; then CHANGED=true; break; fi
            # Comparing the tag against main tells us whether that repository moved. A missing tag
            # means the repository never took part in a release, which also counts as changed.
            AHEAD=$(gh api "/repos/KernAIO/$repo/compare/v$PREV...main" --jq '.ahead_by' 2>/dev/null || echo "missing")
            echo "$repo: $AHEAD commits ahead of v$PREV"
            if [ "$AHEAD" = "missing" ] || [ "${AHEAD:-0}" -gt 0 ]; then CHANGED=true; fi
          done
          if [ "${{ inputs.force || false }}" = "true" ]; then CHANGED=true; fi
          echo "value=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.changed.outputs.value != 'true'
        run: echo "No service repository moved since v${{ steps.v.outputs.prev }} — stopping."

      - name: Refuse to release a red main
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ secrets.KERN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Images are built by docker.yml, which runs whether or not ci.yml passed — so without
          # this, a main that fails lint or tests still becomes a release and rolls onto the cloud
          # unattended. The nightly is only safe because CI is the gate; check that it actually is.
          RED=""
          for repo in $SERVICES; do
            SHA=$(gh api "/repos/KernAIO/$repo/git/ref/heads/main" --jq '.object.sha')
            CONCLUSION=$(gh api "/repos/KernAIO/$repo/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "missing"')
            echo "$repo @ ${SHA:0:8}: $CONCLUSION"
            if [ "$CONCLUSION" != "success" ]; then RED="$RED $repo($CONCLUSION)"; fi
          done
          if [ -n "$RED" ]; then
            echo "::error::Not releasing —$RED. Fix main, or dispatch this workflow again once CI is green."
            exit 1
          fi

      - name: Tag every service repository
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ secrets.KERN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          V='v${{ steps.v.outputs.next }}'
          for repo in $SERVICES; do
            SHA=$(gh api "/repos/KernAIO/$repo/git/ref/heads/main" --jq '.object.sha')
            gh api -X POST "/repos/KernAIO/$repo/git/refs" \
              -f ref="refs/tags/$V" -f sha="$SHA" >/dev/null
            echo "tagged KernAIO/$repo $V at ${SHA:0:8}"
          done

      - name: Wait for every image to exist
        if: steps.changed.outputs.value == 'true'
        run: |
          set -euo pipefail
          V='${{ steps.v.outputs.next }}'
          # release-feed.mjs reads the published images to find out what modules a release contains,
          # so the feed cannot be built until every one of them is pushed.
          # A repository and the image it builds are no longer the same name. `module-chat` builds
          # `chat`, because the image is a deployment artefact every compose file already names and
          # none of them should care which repository moved. Any module that ships a service follows
          # the same rule, so this is a strip rather than a table to maintain.
          image_for() { case "$1" in module-*) echo "${1#module-}";; *) echo "$1";; esac; }

          for repo in $SERVICES; do
            img=$(image_for "$repo")
            echo "waiting for ghcr.io/kernaio/$img:$V  (built by $repo)"
            for i in $(seq 1 60); do
              TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:kernaio/$img:pull&service=ghcr.io" | jq -r .token)
              if curl -fsSL -H "Authorization: Bearer $TOKEN" \
                   -H 'Accept: application/vnd.oci.image.index.v1+json' \
                   "https://ghcr.io/v2/kernaio/$img/manifests/$V" >/dev/null 2>&1; then
                echo "  built"; break
              fi
              if [ "$i" = "60" ]; then
                echo "::error::ghcr.io/kernaio/$img:$V never appeared — check $repo's Docker workflow"
                exit 1
              fi
              sleep 20
            done
          done

      # Publishing the release is what triggers release-feed.yml, which signs the feed and then
      # dispatches rollout.yml. Everything after this point is automatic.
      - name: Publish the release
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V='v${{ steps.v.outputs.next }}'
          gh release create "$V" \
            --repo "${{ github.repository }}" \
            --title "$V" \
            --generate-notes
