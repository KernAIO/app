name: Cloud rollout
# Moves app.kernaio.com onto a released version.
#
# The cloud runs the same images a self-hoster runs, pinned to the same KERN_VERSION the release
# feed announces — so "what is cloud running" has the same answer as "what was released". This
# workflow is the only thing that changes that pin.
#
# `release-feed.yml` calls it once a release's feed is signed, which is what keeps the two in step.
# It is also `workflow_dispatch` on purpose: rolling forward to a version out of band, or rolling
# back to an earlier one, is the same operation and should not need a release to hang off.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to roll out, without a leading v (e.g. 0.2.0)'
        required: true

permissions: { contents: read }
concurrency:
  group: cloud-rollout
  cancel-in-progress: false

jobs:
  rollout:
    # Without the variable there is no cloud to roll out to, which is the normal state of a fork.
    if: vars.KERN_CLOUD_DISPATCH == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record what is live now, in case this needs to roll back
        id: before
        run: |
          set -euo pipefail
          GOT=$(curl -fsS --max-time 10 https://app.kernaio.com/api/health | jq -r '.version // empty' || true)
          echo "version=$GOT" >> "$GITHUB_OUTPUT"
          echo "Currently live: ${GOT:-unreachable}"

      - name: Check the release exists before touching the instance
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'
          # Rolling out a tag that was never built leaves the stack pulling an image that does not
          # exist, and Coolify reports that as a failed deploy rather than as a bad version.
          for image in app core chat mail collab; do
            TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:kernaio/$image:pull&service=ghcr.io" | jq -r .token)
            if ! curl -fsSL -H "Authorization: Bearer $TOKEN" \
                 "https://ghcr.io/v2/kernaio/$image/manifests/$V" \
                 -H 'Accept: application/vnd.oci.image.index.v1+json' >/dev/null 2>&1; then
              echo "::error::ghcr.io/kernaio/$image:$V does not exist — was the release tagged?"
              exit 1
            fi
            echo "ok: ghcr.io/kernaio/$image:$V"
          done

      - name: Pin KERN_VERSION
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          APP_UUID: ${{ vars.KERN_CLOUD_APP_UUID }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          BODY=$(jq -nc --arg v '${{ inputs.version }}' '{key:"KERN_VERSION", value:$v, is_preview:false}')
          # POST creates it the first time and 4xx's afterwards; PATCH updates an existing one.
          curl -fsS -X POST "$COOLIFY_URL/api/v1/applications/$APP_UUID/envs" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$BODY" \
          || curl -fsS -X PATCH "$COOLIFY_URL/api/v1/applications/$APP_UUID/envs" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$BODY"
          echo

      - name: Deploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          APP_UUID: ${{ vars.KERN_CLOUD_APP_UUID }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "$COOLIFY_URL/api/v1/deploy" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg u "$APP_UUID" '{uuid:$u, force:true}')"
          echo

      - name: Wait for the instance to report the version it was given
        id: wait
        continue-on-error: true # a failure here rolls back below rather than just leaving CI red
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'
          # /api/health reports KERN_VERSION as baked into the image, so this checks the rollout
          # actually landed rather than that Coolify accepted the request.
          for i in $(seq 1 40); do
            GOT=$(curl -fsS --max-time 10 https://app.kernaio.com/api/health | jq -r '.version // empty' || true)
            if [ "$GOT" = "$V" ]; then echo "app.kernaio.com is on $V"; exit 0; fi
            echo "attempt $i: reported '${GOT:-unreachable}', want '$V'"
            sleep 15
          done
          echo "::error::app.kernaio.com did not report $V within 10 minutes"
          exit 1

      # There is no traffic-split canary here — one Coolify application, one instance, so a new
      # version goes live for everyone the moment it reports its version. What this buys instead:
      # a version that reports healthy once and then falls over within a few minutes does not stay
      # live. This is a health/reachability regression check, not an error-rate one — nothing in
      # this stack exports a request error rate to check yet.
      - name: Verify it stays healthy, not just that it reported once
        id: verify
        if: steps.wait.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'
          for i in $(seq 1 20); do
            CODE=$(curl -fsS --max-time 10 -o /tmp/health.json -w '%{http_code}' https://app.kernaio.com/api/health || echo 000)
            GOT=$(jq -r '.version // empty' /tmp/health.json 2>/dev/null || true)
            if [ "$CODE" != "200" ] || [ "$GOT" != "$V" ]; then
              echo "::error::regression during verification: http=$CODE version=${GOT:-none}, want 200/$V"
              exit 1
            fi
            echo "check $i/20: healthy on $V"
            sleep 15
          done

      - name: Roll back to what was live before, if the rollout or the verification failed
        if: steps.wait.outcome == 'failure' || steps.verify.outcome == 'failure'
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          APP_UUID: ${{ vars.KERN_CLOUD_APP_UUID }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'
          PREV='${{ steps.before.outputs.version }}'
          if [ -z "$PREV" ]; then
            echo "::error::rollout failed and there was no reachable previous version to roll back to — this needs a person, now"
            exit 1
          fi
          if [ "$PREV" = "$V" ]; then
            echo "::error::rollout of $V failed, but $V was also what was live before it — rolling back to it would do nothing. This needs a person, now"
            exit 1
          fi
          echo "::warning::rolling app.kernaio.com back to $PREV"

          BODY=$(jq -nc --arg v "$PREV" '{key:"KERN_VERSION", value:$v, is_preview:false}')
          curl -fsS -X POST "$COOLIFY_URL/api/v1/applications/$APP_UUID/envs" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$BODY" \
          || curl -fsS -X PATCH "$COOLIFY_URL/api/v1/applications/$APP_UUID/envs" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$BODY"
          echo
          curl -fsS -X POST "$COOLIFY_URL/api/v1/deploy" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg u "$APP_UUID" '{uuid:$u, force:true}')"
          echo

          for i in $(seq 1 40); do
            GOT=$(curl -fsS --max-time 10 https://app.kernaio.com/api/health | jq -r '.version // empty' || true)
            if [ "$GOT" = "$PREV" ]; then
              echo "::error::rolled back to $PREV after $V failed to stay healthy"
              exit 1 # still fail the run — a rollback happened, and that is news, not success
            fi
            echo "rollback attempt $i: reported '${GOT:-unreachable}', want '$PREV'"
            sleep 15
          done
          echo "::error::rollback to $PREV did not land within 10 minutes either — this needs a person, now"
          exit 1
