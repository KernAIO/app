name: Self-host distribution
# `selfhost/` is the only code in this repository that runs on somebody else's machine, and none of
# it is covered by a repo's test suite. The compose file once shipped not parsing at all — a bare
# ${VAR} inside a YAML flow mapping — so `install.sh` failed for every self-hoster while CI stayed
# green, because nothing parsed it.
on:
  push: { branches: [main], paths: ['selfhost/**', 'cloud/**', 'scripts/check-selfhost-drift.py', '.github/workflows/selfhost.yml'] }
  pull_request: { paths: ['selfhost/**', 'cloud/**', 'scripts/check-selfhost-drift.py', '.github/workflows/selfhost.yml'] }

permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The compose file parses and resolves
        working-directory: selfhost
        run: |
          set -euo pipefail
          docker compose --env-file .env.example config >/dev/null
          echo "✔ base profile"
          docker compose --env-file .env.example --profile calls --profile preview --profile autoupdate config >/dev/null
          echo "✔ every profile"

      # `db-init` is the one piece of SQL that runs on every existing instance at every deploy, and
      # parsing the compose file says nothing about it. On 2026-09-02 its ownership handover reached
      # the cloud with a nightly rollout, tried to `ALTER SEQUENCE … OWNER` on a serial's sequence
      # separately from its table, exited 3, and every container stayed `Created` — including the
      # rollback's. So it runs here against a database that already has objects owned by the
      # superuser, the state every instance installed before the handover is in, and it runs twice,
      # because it runs on every deploy for ever.
      - name: db-init succeeds against a database that already has objects, twice
        working-directory: selfhost
        run: |
          set -euo pipefail
          sed -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres/' \
              -e 's/^KERN_DB_APP_PASSWORD=.*/KERN_DB_APP_PASSWORD=ci-app/' .env.example > .env.ci
          compose() { docker compose --env-file .env.ci -p kern-selfhost-ci "$@"; }
          trap 'compose down -v >/dev/null 2>&1 || true; rm -f .env.ci' EXIT
          compose up -d postgres
          for i in $(seq 1 40); do
            [ "$(compose ps --format '{{.Health}}' postgres)" = "healthy" ] && break
            [ "$i" = "40" ] && { echo "postgres never became healthy"; compose logs postgres; exit 1; }
            sleep 2
          done
          # What an instance from before the handover looks like: a module schema, its migration
          # bookkeeping with a serial primary key, and a plain table — all owned by the superuser.
          compose exec -T postgres psql -U kern -d kern -v ON_ERROR_STOP=1 -c "
            create schema mod_ci;
            create table mod_ci.__migrations (id serial primary key, hash text);
            create table mod_ci.things (id uuid primary key, name text);
            create sequence mod_ci.standalone_seq;"
          compose run --rm db-init
          compose run --rm db-init
          OWNERS=$(compose exec -T postgres psql -U kern -d kern -tAc "
            select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'mod_ci' and c.relkind in ('r','S') and pg_get_userbyid(c.relowner) <> 'kern_app'")
          [ "$OWNERS" = "0" ] || { echo "$OWNERS objects in mod_ci are still not owned by kern_app"; exit 1; }
          echo "✔ db-init handed every object to kern_app, and survives a second run"

      - name: The updater is not pinned to KERN_VERSION
        working-directory: selfhost
        # An upgrade must not recreate the container that is running the upgrade. Compose only
        # recreates a service whose config changed, so the updater's image tag has to stay put
        # while every other one moves.
        run: |
          set -euo pipefail
          image=$(docker compose --env-file .env.example --profile autoupdate config \
            | python3 -c 'import sys,yaml; print(yaml.safe_load(sys.stdin)["services"]["updater"]["image"])')
          echo "updater image: $image"
          case "$image" in
            *"$(grep -E '^KERN_VERSION=' .env.example | cut -d= -f2)"*)
              echo "::error::the updater follows KERN_VERSION, so an upgrade would kill it mid-run"
              exit 1 ;;
          esac

      - name: The Coolify and cloud compose files parse and resolve
        # Their variables come from Coolify, not from a .env, so `config` warns about every one of
        # them being unset. That is the expected state here; only a parse failure matters.
        run: |
          set -euo pipefail
          for f in selfhost/coolify/docker-compose.yml cloud/docker-compose.yml; do
            docker compose -f "$f" config >/dev/null
            echo "✔ $f"
          done

      - name: The Coolify stack is the same stack
        run: python3 scripts/check-selfhost-drift.py

      - name: The Caddy configs the Coolify and cloud stacks write are valid
        # Each is a heredoc inside a container command rather than a file, so nothing else would
        # ever read it. Adapting it in the real image is the only way to find out that it is wrong.
        run: |
          set -euo pipefail
          python3 scripts/check-selfhost-drift.py \
            --emit-caddyfile /tmp/Caddyfile \
            --emit-cloud-caddyfile /tmp/Caddyfile.cloud
          for f in /tmp/Caddyfile /tmp/Caddyfile.cloud; do
            docker run --rm -v "$f":/etc/caddy/Caddyfile:ro caddy:2-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "✔ $f"
          done

      - name: The scripts parse
        working-directory: selfhost
        run: |
          set -euo pipefail
          for f in install.sh kern-upgrade.sh kern-rollback.sh; do bash -n "$f"; echo "✔ $f"; done

      - name: shellcheck
        working-directory: selfhost
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC2086 (word splitting) is deliberate for the compose profile list
          shellcheck --severity=warning --exclude=SC2086 install.sh kern-upgrade.sh kern-rollback.sh

      - name: Every variable the compose file reads is in .env.example
        working-directory: selfhost
        run: |
          set -euo pipefail
          missing=0
          for var in $(grep -ohE '\$\{[A-Z_][A-Z0-9_]*' docker-compose.yml | sed 's/^\${//' | sort -u); do
            grep -qE "^${var}=" .env.example || { echo "::error::${var} is not in .env.example"; missing=1; }
          done
          [ "$missing" -eq 0 ] && echo "✔ every variable documented"
