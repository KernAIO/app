name: Self-host distribution
# `selfhost/` is the only code in this repository that runs on somebody else's machine, and none of
# it is covered by a repo's test suite. The compose file once shipped not parsing at all — a bare
# ${VAR} inside a YAML flow mapping — so `install.sh` failed for every self-hoster while CI stayed
# green, because nothing parsed it.
on:
  push: { branches: [main], paths: ['selfhost/**', 'cloud/**', 'scripts/check-selfhost-drift.py', '.github/workflows/selfhost.yml'] }
  pull_request: { paths: ['selfhost/**', 'cloud/**', 'scripts/check-selfhost-drift.py', '.github/workflows/selfhost.yml'] }

permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The compose file parses and resolves
        working-directory: selfhost
        run: |
          set -euo pipefail
          docker compose --env-file .env.example config >/dev/null
          echo "✔ base profile"
          docker compose --env-file .env.example --profile calls --profile preview --profile autoupdate config >/dev/null
          echo "✔ every profile"

      # `db-init` is the one piece of SQL that runs on every existing instance at every deploy, and
      # parsing the compose file says nothing about it. On 2026-09-02 its ownership handover reached
      # the cloud with a nightly rollout, tried to `ALTER SEQUENCE … OWNER` on a serial's sequence
      # separately from its table, exited 3, and every container stayed `Created` — including the
      # rollback's. So it runs here against a database that already has objects owned by the
      # superuser, the state every instance installed before the handover is in, and it runs twice,
      # because it runs on every deploy for ever.
      - name: db-init succeeds against a database that already has objects, twice
        working-directory: selfhost
        run: |
          set -euo pipefail
          sed -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres/' \
              -e 's/^KERN_DB_APP_PASSWORD=.*/KERN_DB_APP_PASSWORD=ci-app/' .env.example > .env.ci
          compose() { docker compose --env-file .env.ci -p kern-selfhost-ci "$@"; }
          trap 'compose down -v >/dev/null 2>&1 || true; rm -f .env.ci' EXIT
          compose up -d postgres
          for i in $(seq 1 40); do
            [ "$(compose ps --format '{{.Health}}' postgres)" = "healthy" ] && break
            [ "$i" = "40" ] && { echo "postgres never became healthy"; compose logs postgres; exit 1; }
            sleep 2
          done
          # What an instance from before the handover looks like: a module schema, its migration
          # bookkeeping with a serial primary key, a plain table, a standalone sequence, and — the
          # shape pg-boss uses for kern_jobs.job — a partitioned table with a partition. All owned by
          # the superuser. A partitioned parent carries an *internal* dependency on itself and its
          # partition an *auto* dependency on the parent, and ALTER TABLE OWNER recurses to neither:
          # the two pg-boss tables were skipped by every handover before 2026-09-02 and the cloud
          # lost its job queue for two hours the first time the services ran as kern_app.
          compose exec -T postgres psql -U kern -d kern -v ON_ERROR_STOP=1 -c "
            create schema mod_ci;
            create table mod_ci.__migrations (id serial primary key, hash text);
            create table mod_ci.things (id uuid primary key, name text);
            create sequence mod_ci.standalone_seq;
            create table mod_ci.job (id uuid, created_on date) partition by range (created_on);
            create table mod_ci.job_2026 partition of mod_ci.job for values from ('2026-01-01') to ('2027-01-01');"
          compose run --rm db-init
          compose run --rm db-init
          OWNERS=$(compose exec -T postgres psql -U kern -d kern -tAc "
            select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'mod_ci' and c.relkind in ('r','p','S') and pg_get_userbyid(c.relowner) <> 'kern_app'")
          [ "$OWNERS" = "0" ] || { echo "$OWNERS objects in mod_ci are still not owned by kern_app"; exit 1; }
          echo "✔ db-init handed every object to kern_app, and survives a second run"

      - name: The updater is not pinned to KERN_VERSION
        working-directory: selfhost
        # An upgrade must not recreate the container that is running the upgrade. Compose only
        # recreates a service whose config changed, so the updater's image tag has to stay put
        # while every other one moves.
        run: |
          set -euo pipefail
          image=$(docker compose --env-file .env.example --profile autoupdate config \
            | python3 -c 'import sys,yaml; print(yaml.safe_load(sys.stdin)["services"]["updater"]["image"])')
          echo "updater image: $image"
          case "$image" in
            *"$(grep -E '^KERN_VERSION=' .env.example | cut -d= -f2)"*)
              echo "::error::the updater follows KERN_VERSION, so an upgrade would kill it mid-run"
              exit 1 ;;
          esac

      - name: The Coolify and cloud compose files parse and resolve
        # Their variables come from Coolify, not from a .env, so `config` warns about every one of
        # them being unset. That is the expected state here; only a parse failure matters. The one
        # variable the files *require* (`${KERN_ADMIN_EMAIL:?…}` — an instance with no first
        # administrator is unrecoverable) is given a value, or `config` refuses on purpose.
        env:
          KERN_ADMIN_EMAIL: ci@example.com
        run: |
          set -euo pipefail
          for f in selfhost/coolify/docker-compose.yml cloud/docker-compose.yml; do
            docker compose -f "$f" config >/dev/null
            echo "✔ $f"
          done

      - name: The Coolify stack is the same stack
        run: python3 scripts/check-selfhost-drift.py

      - name: selfhost/Caddyfile is valid
        # The two inline copies were adapted below and this one was not, so the file that actually
        # ships to every self-hoster was the only Caddy config in the repository nothing parsed.
        # `docker compose config` does not read it — it is a mounted volume, a string to Compose.
        # The placeholders are what the site block is built from, so they need values to adapt at
        # all; any value will do, because this checks the syntax and not the domain.
        run: |
          set -euo pipefail
          docker run --rm -e KERN_DOMAIN=selfhost.example.com -e ACME_EMAIL=ci@example.com \
            -v "$PWD/selfhost/Caddyfile":/etc/caddy/Caddyfile:ro caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          echo "✔ selfhost/Caddyfile"

      - name: The Caddy configs the Coolify and cloud stacks write are valid
        # Each is a heredoc inside a container command rather than a file, so nothing else would
        # ever read it. Adapting it in the real image is the only way to find out that it is wrong.
        run: |
          set -euo pipefail
          python3 scripts/check-selfhost-drift.py \
            --emit-caddyfile /tmp/Caddyfile \
            --emit-cloud-caddyfile /tmp/Caddyfile.cloud
          for f in /tmp/Caddyfile /tmp/Caddyfile.cloud; do
            docker run --rm -v "$f":/etc/caddy/Caddyfile:ro caddy:2-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "✔ $f"
          done

      - name: The scripts parse
        working-directory: selfhost
        run: |
          set -euo pipefail
          for f in install.sh kern-upgrade.sh kern-rollback.sh kern-backup.sh; do bash -n "$f"; echo "✔ $f"; done

      - name: shellcheck
        working-directory: selfhost
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC2086 (word splitting) is deliberate for the compose profile list
          shellcheck --severity=warning --exclude=SC2086 install.sh kern-upgrade.sh kern-rollback.sh kern-backup.sh

      # The fixture below proves the *mechanism*. This step proves the **list**, which is the half
      # that actually went wrong: `livekit.yaml` was downloaded by install.sh and absent from
      # kern-upgrade.sh's STACK_FILES, so an upgraded instance kept the 50000-50200 media config
      # while the compose file it had just been handed published 7882. Nothing could see it — a file
      # missing from a list looks exactly like a file that is already current, and the upgrade
      # printed its green tick either way.
      #
      # So the two lists are held to each other: every file install.sh downloads is either brought
      # forward by an upgrade, or named here with the reason it is not.
      - name: Every file install.sh downloads is one an upgrade can bring forward
        working-directory: selfhost
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys

          # kern-upgrade.sh cannot replace itself: bash reads a script incrementally, so rewriting
          # this file underneath a running interpreter resumes at a byte offset in different text.
          # It is offered as kern-upgrade.sh.new instead, which is a delivery, not an omission.
          #
          # The systemd units are copied into the operator's ~/.config/systemd/user by install.sh,
          # and that copy is what systemd runs — replacing the one in the install directory would
          # change nothing on the machine. Bringing them forward means reinstalling the units, which
          # is a different job from refreshing a file.
          EXCEPT = {
              "kern-upgrade.sh",
              "systemd/kern-auto-update.service",
              "systemd/kern-auto-update.timer",
              "systemd/kern-backup.service",
              "systemd/kern-backup.timer",
          }

          downloaded = re.search(r"\nfor f in (.*?); do\n", open("install.sh").read(), re.S)
          assert downloaded, "install.sh no longer has the `for f in ...; do` download loop"
          downloaded = set(downloaded.group(1).replace("\\\n", " ").split())

          carried = re.search(r'^STACK_FILES="([^"]*)"', open("kern-upgrade.sh").read(), re.M)
          assert carried, "kern-upgrade.sh no longer declares STACK_FILES"
          carried = set(carried.group(1).split())

          failed = False
          for f in sorted(downloaded - carried - EXCEPT):
              failed = True
              print(f"::error::install.sh downloads {f}, and no upgrade ever replaces it. Add it to "
                    f"STACK_FILES in kern-upgrade.sh, or to EXCEPT here with the reason.")
          for f in sorted(carried - downloaded):
              failed = True
              print(f"::error::kern-upgrade.sh brings {f} forward, but install.sh never puts it on "
                    f"an instance. One of the two lists is wrong.")
          sys.exit(1 if failed else 0)
          PY
          echo "✔ every distribution file is either carried forward or declared"

      # An upgrade used to change KERN_VERSION and pull images, and nothing else — install.sh
      # downloads a distribution file only when it is absent, so an instance kept the
      # docker-compose.yml, Caddyfile and postgres-init/ it was installed with for ever. Every fix
      # living in one of those files reached new installs only, however many releases went by; the
      # MCP Caddy route is the worked example and is what this fixture upgrades across.
      #
      # No Docker and no Kern: KERN_RAW_BASE points the fetch at a directory laid out as
      # <ref>/selfhost/<file>, and `--stack-files` is the refresh on its own.
      - name: An upgrade brings the release's stack files forward
        run: |
          set -euo pipefail
          WORK=$(mktemp -d); UP="$WORK/upstream"

          # v0.0.2 is this repository's selfhost/ as it stands. v0.0.1 is the same thing before the
          # MCP route existed — the state of every instance installed before that route shipped, and
          # a file no upgrade has ever been able to correct.
          mkdir -p "$UP/v0.0.2" "$UP/v0.0.1"
          cp -R selfhost "$UP/v0.0.2/selfhost"
          cp -R selfhost "$UP/v0.0.1/selfhost"
          python3 - "$UP/v0.0.1/selfhost/Caddyfile" <<'PY'
          import re, sys
          src = open("selfhost/Caddyfile").read()
          out = re.sub(r"\n\t@mcp path [^\n]*\n\thandle @mcp \{\n[^}]*\n\t\}\n", "\n", src)
          assert "@mcp" not in out, "fixture failed to strip the MCP route"
          open(sys.argv[1], "w").write(out)
          PY

          new_instance() {
            rm -rf "$1"; mkdir -p "$1"
            cp -R "$UP/v0.0.1/selfhost/." "$1/"
            cp selfhost/kern-upgrade.sh "$1/kern-upgrade.sh"; chmod +x "$1/kern-upgrade.sh"
            printf "KERN_VERSION='0.0.1'\n" > "$1/.env"
          }

          echo "== an untouched instance gets the release's files =="
          I="$WORK/untouched"; new_instance "$I"
          grep -q '@mcp' "$I/Caddyfile" && { echo "::error::fixture already has the route"; exit 1; }
          ( cd "$I" && KERN_RAW_BASE="$UP" ./kern-upgrade.sh --stack-files 0.0.2 )
          grep -q '@mcp path /mcp' "$I/Caddyfile" \
            || { echo "::error::the MCP route did not reach the upgraded instance"; exit 1; }
          cmp -s "$I/Caddyfile" selfhost/Caddyfile \
            || { echo "::error::the Caddyfile is not the one this release ships"; exit 1; }
          [ -n "$(find "$I/snapshots" -name Caddyfile)" ] \
            || { echo "::error::the replaced Caddyfile was not kept"; exit 1; }
          echo "✔ the route arrived and the old copy was kept"

          echo "== a second run changes nothing =="
          # Written to a file rather than piped into grep: `grep -q` closes the pipe on its first
          # match, the script dies of SIGPIPE, and pipefail then reports the pipeline as failed.
          ( cd "$I" && KERN_RAW_BASE="$UP" ./kern-upgrade.sh --stack-files 0.0.2 ) > "$WORK/out2" 2>&1
          grep -q 'already matches release' "$WORK/out2" \
            || { echo "::error::a second run did not report the files as current"; cat "$WORK/out2"; exit 1; }
          echo "✔ idempotent"

          echo "== an operator's edit is refused loudly, not overwritten =="
          I="$WORK/edited"; new_instance "$I"
          printf '\n# operator added a redirect\n' >> "$I/Caddyfile"
          before=$(cat "$I/Caddyfile")
          if ( cd "$I" && KERN_RAW_BASE="$UP" ./kern-upgrade.sh --stack-files 0.0.2 ) > "$WORK/out" 2>&1; then
            echo "::error::an edited Caddyfile was reported as a success"; cat "$WORK/out"; exit 1
          fi
          [ "$before" = "$(cat "$I/Caddyfile")" ] \
            || { echo "::error::an operator's edit was overwritten"; exit 1; }
          grep -q 'NOT brought forward' "$WORK/out" \
            || { echo "::error::the refusal was silent"; cat "$WORK/out"; exit 1; }
          [ -n "$(find "$I/snapshots" -name 'Caddyfile.diff')" ] \
            || { echo "::error::no diff was left for the operator to merge"; exit 1; }
          cmp -s "$I/docker-compose.yml" selfhost/docker-compose.yml \
            || { echo "::error::one refused file stopped the others coming forward"; exit 1; }
          echo "✔ refused with a diff, and the unedited files still came forward"
          rm -rf "$WORK"

      # ---------------------------------------------------------------- the recovery path
      #
      # The three steps below are the scripts an operator reaches for when something has gone wrong,
      # so a defect in one costs a customer their data rather than their patience. Each is a
      # regression that shipped: they are here as the reproduction that found it, not as a summary
      # of the fix.

      # kern-upgrade.sh writes the stack-file diffs an operator has to merge into snapshots/ as
      # `stack-<stamp>/`, and creates it *after* the snapshot — so on any instance whose upgrade
      # touched a stack file the newest directory in there is not a snapshot at all. Selecting it
      # made `./kern-rollback.sh` refuse with "no from-version file" while a good snapshot sat
      # beside it, and install.sh prints that command as the way out of a bad upgrade.
      - name: A rollback with no argument picks a snapshot it can use
        run: |
          set -euo pipefail
          W=$(mktemp -d); I="$W/instance"; mkdir -p "$I/snapshots" "$W/bin"
          cp selfhost/kern-rollback.sh "$I/"; chmod +x "$I/kern-rollback.sh"
          printf "KERN_VERSION='1.2.0'\n" > "$I/.env"

          # A stand-in for docker, so the rollback can be driven to its last line without a stack.
          printf '#!/bin/sh\nexit 0\n' > "$W/bin/docker"; chmod +x "$W/bin/docker"

          # Laid out exactly as an upgrade leaves it: the snapshot, then the stack diffs beside it.
          mkdir -p "$I/snapshots/1.1.0-to-1.2.0-20260905-140301"
          printf '1.1.0\n' > "$I/snapshots/1.1.0-to-1.2.0-20260905-140301/from-version"
          sleep 1
          mkdir -p "$I/snapshots/stack-20260905-140302"
          printf 'diff\n' > "$I/snapshots/stack-20260905-140302/Caddyfile.diff"
          [ "$(ls -1dt "$I"/snapshots/*/ | head -1)" = "$I/snapshots/stack-20260905-140302/" ] \
            || { echo "::error::fixture is wrong — the stack directory is not the newest"; exit 1; }

          if ! ( cd "$I" && PATH="$W/bin:$PATH" ./kern-rollback.sh ) > "$W/out" 2>&1; then
            echo "::error::the rollback refused with a usable snapshot on disk"; cat "$W/out"; exit 1
          fi
          if grep -q 'no from-version file' "$W/out"; then
            echo "::error::it picked a stack-<stamp> directory instead of the snapshot"; cat "$W/out"; exit 1
          fi
          grep -q 'Kern is back on 1.1.0' "$W/out" \
            || { echo "::error::the rollback did not complete"; cat "$W/out"; exit 1; }
          grep -q "^KERN_VERSION='1.1.0'$" "$I/.env" \
            || { echo "::error::KERN_VERSION was not put back"; cat "$I/.env"; exit 1; }
          echo "✔ the newest snapshot that records a version is the one it used"
          rm -rf "$W"

      # A backup interrupted at the wrong moment was published as a complete one. The trap ran the
      # same handler for EXIT, INT and TERM, and a *signal* handler that returns hands control back
      # to the line after the interrupted one — so the working directory was deleted, the script
      # carried on, mkdir made it again, and the publish moved a directory holding no database dump
      # into place under a green "Backup complete". The prune then counted it and deleted a real
      # backup to stay under the limit.
      #
      # It turns entirely on when the signal arrives, so no reviewer will spot it: this drives the
      # signal in deliberately, at each phase, with a docker that still exits 0 afterwards.
      - name: An interrupted backup is never published as a complete one
        run: |
          set -euo pipefail
          W=$(mktemp -d); mkdir -p "$W/bin"

          cat > "$W/bin/docker" <<'STUB'
          #!/usr/bin/env bash
          # Every compose command a backup issues succeeds. The one named in KERN_TEST_SIGNAL_AT
          # signals the script first and then still exits 0 — the shape of a Ctrl-C, or of the
          # backup timer's 6h TimeoutStartSec, arriving mid-run.
          ARGS="$*"
          signal_if_asked() {
            [ "${KERN_TEST_SIGNAL_AT:-}" = "$1" ] || return 0
            kill -"${KERN_TEST_SIGNAL:-TERM}" "$(cat "$KERN_TEST_PID")"
            sleep 0.3
          }
          case "$ARGS" in
            *"ps --status running --quiet postgres"*) exit 0 ;;
            *"ps --status running --quiet minio"*)    signal_if_asked minio; exit 0 ;;
            *pg_dump*) signal_if_asked dump; printf 'PGDMP'; head -c 40000 /dev/zero | tr '\0' 'x'; exit 0 ;;
            *minio-init*) signal_if_asked mirror; exit 0 ;;
          esac
          exit 0
          STUB
          chmod +x "$W/bin/docker"

          new_instance() { # new_instance <dir>
            rm -rf "$1"; mkdir -p "$1/backups"
            cp selfhost/kern-backup.sh "$1/kern-backup.sh"; chmod +x "$1/kern-backup.sh"
            printf 'services: {}\n' > "$1/docker-compose.yml"
            cat > "$1/.env" <<'ENV'
          KERN_VERSION='1.2.0'
          POSTGRES_USER='kern'
          POSTGRES_DB='kern'
          S3_BUCKET='kern'
          S3_ACCESS_KEY='key'
          S3_SECRET_KEY='secret'
          S3_ENDPOINT='http://minio:9000'
          ENV
            # A good backup from an earlier night, so there is something real to lose.
            mkdir -p "$1/backups/20260101-030000/files"
            printf 'PGDMP-a-real-one\n' > "$1/backups/20260101-030000/database.dump"
            printf 'real\n' > "$1/backups/20260101-030000/RESTORE.txt"
          }

          run_backup() { # run_backup <dir> <phase> <signal> [args...]
            local dir="$1" phase="$2" sig="$3"; shift 3
            # Foreground, not `&`: an asynchronous command in a non-interactive shell inherits
            # SIGINT as ignored, and a script cannot trap a signal that was ignored on entry — so a
            # backgrounded run would pass this for a reason that has nothing to do with the script.
            ( cd "$dir" \
              && PATH="$W/bin:$PATH" KERN_TEST_SIGNAL_AT="$phase" KERN_TEST_SIGNAL="$sig" \
                 KERN_TEST_PID="$W/pid" \
                 sh -c 'echo $$ > '"$W"'/pid; exec ./kern-backup.sh "$@"' -- "$@" \
            ) > "$W/out" 2>&1
          }

          for phase in dump minio mirror; do
            for sig in TERM INT; do
              I="$W/i"; new_instance "$I"
              if run_backup "$I" "$phase" "$sig"; then
                echo "::error::a backup interrupted at $phase by SIG$sig reported success"
                cat "$W/out"; exit 1
              fi
              if grep -q 'Backup complete' "$W/out"; then
                echo "::error::SIG$sig at $phase printed a green Backup complete"; cat "$W/out"; exit 1
              fi
              published=$(ls -1d "$I"/backups/[0-9]*-[0-9]*/ 2>/dev/null | grep -cv '20260101-030000' || true)
              [ "$published" -eq 0 ] \
                || { echo "::error::SIG$sig at $phase published a backup"; ls -lR "$I/backups"; exit 1; }
              [ -z "$(find "$I/backups" -maxdepth 1 -name '.*.partial')" ] \
                || { echo "::error::SIG$sig at $phase left its working directory behind"; exit 1; }
              [ -f "$I/backups/20260101-030000/database.dump" ] \
                || { echo "::error::SIG$sig at $phase destroyed the backup that was already there"; exit 1; }
              echo "  ✔ SIG$sig at $phase: nothing published, the existing backup untouched"
            done
          done

          echo "== an uninterrupted backup is still published =="
          I="$W/i"; new_instance "$I"
          run_backup "$I" none TERM || { echo "::error::an ordinary backup failed"; cat "$W/out"; exit 1; }
          grep -q 'Backup complete' "$W/out" || { echo "::error::no completion line"; cat "$W/out"; exit 1; }
          NEW=$(ls -1d "$I"/backups/[0-9]*-[0-9]*/ | grep -v '20260101-030000' | head -1)
          [ -s "${NEW}database.dump" ] \
            || { echo "::error::a published backup holds no dump"; ls -l "$NEW"; exit 1; }
          echo "✔ published $(basename "${NEW%/}") with its dump"

          echo "== a copy with no dump never costs a real backup its place =="
          I="$W/i"; new_instance "$I"
          # What a run of the pre-2026-09-05 script left behind, dated so it sorts newest of all.
          mkdir -p "$I/backups/29991231-000000"
          printf 'config only\n' > "$I/backups/29991231-000000/.env"
          run_backup "$I" none TERM --keep 1 \
            || { echo "::error::the backup failed"; cat "$W/out"; exit 1; }
          NEW=$(ls -1d "$I"/backups/[0-9]*-[0-9]*/ | grep -v -e 20260101-030000 -e 29991231-000000 | head -1)
          [ -d "$NEW" ] \
            || { echo "::error::the prune deleted the backup this run had just taken"; ls "$I/backups"; exit 1; }
          [ ! -d "$I/backups/20260101-030000" ] \
            || { echo "::error::--keep 1 kept two backups"; ls "$I/backups"; exit 1; }
          grep -q 'not counted' "$W/out" \
            || { echo "::error::the dump-less copy was not reported"; cat "$W/out"; exit 1; }
          echo "✔ the dump-less copy was named and skipped, and the real backup kept its place"
          rm -rf "$W"

      # The step above proves a backup is never published half-written. It says nothing about
      # whether the thing it wrote can be restored, and until 2026-09-06 nothing anywhere did:
      # kern-backup.sh writes a RESTORE.txt telling an operator how, and nobody had followed it.
      #
      # This runs the whole round trip against real containers — seed an instance, take a backup
      # with the script exactly as it ships, then restore onto a second stack by executing the
      # commands **read out of the RESTORE.txt that backup wrote**, and diff a census of the two
      # databases. Reading the commands rather than retyping them is the point: a procedure this
      # workflow transcribes is a procedure that can rot in the file while CI stays green.
      #
      # It found one defect on the first run. Step 4 mirrored the files back into a bucket that
      # does not exist — step 2 starts `postgres minio` and not `minio-init`, which is the only
      # thing that ever creates the bucket, and `mc mirror` does not create one. Following the
      # file on an empty host lost every uploaded file in the instance, loudly but with no way
      # forward. `mc mb -p` is in step 4 now.
      - name: A backup restores, and the restored database is the same database
        run: |
          set -euo pipefail
          W=$(mktemp -d); I="$W/instance"; N="$W/newhost"; mkdir -p "$I" "$N"

          # The two stacks must be different Compose projects. selfhost/docker-compose.yml sets
          # `name: kern`, so an instance and the host it is restored onto are the same project by
          # default — the "new host" would find the instance's containers already up and the
          # restore would overwrite the database it had just dumped. COMPOSE_PROJECT_NAME
          # overrides the file's `name:`, and it is an environment variable rather than an edit,
          # so kern-backup.sh still runs exactly as it ships.
          inst() { ( cd "$I" && COMPOSE_PROJECT_NAME=kern-drill-src docker compose "$@" ); }
          newh() { ( cd "$N" && COMPOSE_PROJECT_NAME=kern-drill-dst docker compose "$@" ); }
          cleanup() {
            inst down -v >/dev/null 2>&1 || true
            newh down -v >/dev/null 2>&1 || true
            return 0
          }
          trap cleanup EXIT

          # ------------------------------------------------ an instance with something to lose

          cp selfhost/docker-compose.yml selfhost/Caddyfile selfhost/livekit.yaml \
             selfhost/kern-backup.sh "$I/"
          cp -R selfhost/postgres-init "$I/postgres-init"
          chmod +x "$I/kern-backup.sh"
          sed -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres/' \
              -e 's/^KERN_DB_APP_PASSWORD=.*/KERN_DB_APP_PASSWORD=ci-app/' \
              -e 's/^S3_SECRET_KEY=.*/S3_SECRET_KEY=ci-secret-key/' selfhost/.env.example > "$I/.env"

          inst up -d postgres minio
          for i in $(seq 1 40); do
            [ "$(inst ps --format '{{.Health}}' postgres)" = "healthy" ] && break
            [ "$i" = "40" ] && { echo "::error::postgres never became healthy"; inst logs postgres; exit 1; }
            sleep 2
          done
          inst run --rm db-init >/dev/null

          # A dump is only as good as the shapes it has to carry, so this is the awkward half of a
          # Kern schema rather than a few tables: a partitioned parent with its partitions, a
          # sequence no column owns, an identity and two serials, forced row-level security with
          # policies, an enum, a view, a routine, a vector column, an ltree, a trigram index, and
          # module-inventory's gist exclusion constraint — the one that needs btree_gist.
          cat > "$W/seed.sql" <<'SQL'
          create type public.member_role as enum ('owner', 'admin', 'member');

          create table public.workspaces (
            id uuid primary key default gen_random_uuid(),
            slug text not null unique,
            name text not null,
            path ltree,
            created_at timestamptz not null default now()
          );

          create table public.memberships (
            id bigserial primary key,
            workspace_id uuid not null references public.workspaces(id) on delete cascade,
            email text not null,
            role public.member_role not null default 'member',
            unique (workspace_id, email)
          );
          alter table public.memberships enable row level security;
          alter table public.memberships force row level security;
          create policy memberships_ws on public.memberships using (
            workspace_id::text = current_setting('app.workspace_id', true)
            or current_setting('app.workspace_id', true) = '*'
          );

          create schema mod_ci_a;

          create table mod_ci_a.things (
            id uuid primary key default gen_random_uuid(),
            workspace_id uuid not null references public.workspaces(id) on delete cascade,
            name text not null,
            embedding vector(3),
            tags text
          );
          create index things_name_trgm on mod_ci_a.things using gin (name gin_trgm_ops);
          alter table mod_ci_a.things enable row level security;
          alter table mod_ci_a.things force row level security;
          create policy things_ws on mod_ci_a.things using (
            workspace_id::text = current_setting('app.workspace_id', true)
          );

          create table mod_ci_a.punches (
            id bigint generated by default as identity,
            workspace_id uuid not null,
            at timestamptz not null,
            minutes integer not null,
            primary key (id, at)
          ) partition by range (at);
          create table mod_ci_a.punches_2026q1 partition of mod_ci_a.punches
            for values from ('2026-01-01') to ('2026-04-01');
          create table mod_ci_a.punches_2026q2 partition of mod_ci_a.punches
            for values from ('2026-04-01') to ('2026-07-01');
          create table mod_ci_a.punches_2026q3 partition of mod_ci_a.punches
            for values from ('2026-07-01') to ('2026-10-01');
          alter table mod_ci_a.punches enable row level security;
          alter table mod_ci_a.punches force row level security;
          create policy punches_ws on mod_ci_a.punches using (
            workspace_id::text = current_setting('app.workspace_id', true)
          );

          create schema mod_ci_b;

          create table mod_ci_b.custody (
            id uuid primary key default gen_random_uuid(),
            asset_id uuid not null,
            held timestamptz not null,
            released timestamptz,
            exclude using gist (asset_id with =, tstzrange(held, released) with &&)
          );

          create table mod_ci_b.notes (
            id serial primary key,
            body text not null,
            created_at timestamptz not null default now()
          );

          create sequence mod_ci_b.counter_seq;

          create function mod_ci_b.note_count() returns bigint language sql stable as
            $fn$ select count(*) from mod_ci_b.notes $fn$;

          create view mod_ci_b.recent_notes as
            select id, body from mod_ci_b.notes order by id desc limit 10;

          insert into public.workspaces (slug, name, path)
          select 'ws-' || g, 'Workspace ' || g, text2ltree('root.ws' || g) from generate_series(1, 3) g;

          insert into public.memberships (workspace_id, email, role)
          select w.id, 'person' || g || '@' || w.slug || '.example',
                 (array['owner','admin','member'])[1 + (g % 3)]::public.member_role
          from public.workspaces w, generate_series(1, 7) g;

          insert into mod_ci_a.things (workspace_id, name, embedding, tags)
          select w.id, 'thing ' || g, array[g, g * 2, g * 3]::vector, 'a,b,c'
          from public.workspaces w, generate_series(1, 200) g;

          insert into mod_ci_a.punches (workspace_id, at, minutes)
          select w.id, timestamptz '2026-01-15 08:00+00' + (g || ' days')::interval, 30 + (g % 400)
          from public.workspaces w, generate_series(0, 240) g;

          insert into mod_ci_b.custody (asset_id, held, released)
          select gen_random_uuid(), timestamptz '2026-02-01' + (g || ' days')::interval,
                 timestamptz '2026-02-01' + (g || ' days')::interval + interval '12 hours'
          from generate_series(1, 60) g;

          insert into mod_ci_b.notes (body) select 'note ' || g from generate_series(1, 137) g;

          select setval('mod_ci_b.counter_seq', 4242);
          SQL

          inst exec -T postgres psql -U kern -d kern -q -v ON_ERROR_STOP=1 -f - < "$W/seed.sql" >/dev/null
          # Every boot runs db-init, and it is what hands objects a migration just created to
          # kern_app. Running it here is what makes the ownership in the census mean something.
          inst run --rm db-init >/dev/null

          inst run --rm --no-deps --entrypoint /bin/sh minio-init -c "
            mc alias set src http://minio:9000 kern ci-secret-key >/dev/null &&
            mc mb -p src/kern >/dev/null &&
            echo 'attachment one' | mc pipe src/kern/ws1/a.txt >/dev/null &&
            printf 'binary\\000payload' | mc pipe src/kern/ws2/deep/b.bin >/dev/null" >/dev/null

          # Rows alone are not the claim a backup makes. A dump that carried every row and lost the
          # policies would restore an instance in which every workspace reads every other one, and
          # a row count cannot see that — so ownership, the forced-RLS flags, the policies, the
          # indexes, the constraints, the routines, the types and the sequence positions are all in
          # the census beside the counts. `relkind in ('r','p')`, because a partitioned parent is
          # filed as 'p' and a census that asks only for 'r' skips the biggest table in silence.
          cat > "$W/census.sql" <<'SQL'
          set timezone = 'UTC';
          set extra_float_digits = 0;

          select 'extension ' || extname from pg_extension where extname <> 'plpgsql';

          select 'schema ' || nspname || ' owner=' || pg_get_userbyid(nspowner)
          from pg_namespace where nspname in ('public', 'mod_ci_a', 'mod_ci_b');

          select 'relation ' || n.nspname || '.' || c.relname
                 || ' kind=' || c.relkind::text
                 || ' owner=' || pg_get_userbyid(c.relowner)
                 || ' rls=' || c.relrowsecurity::text || ' force=' || c.relforcerowsecurity::text
          from pg_class c join pg_namespace n on n.oid = c.relnamespace
          where n.nspname in ('public', 'mod_ci_a', 'mod_ci_b')
            and c.relkind in ('r', 'p', 'v', 'm', 'S', 'f');

          select 'column ' || n.nspname || '.' || c.relname || '.' || a.attname
                 || ' ' || format_type(a.atttypid, a.atttypmod)
                 || ' notnull=' || a.attnotnull::text
                 || ' default=' || coalesce(pg_get_expr(d.adbin, d.adrelid), '-')
          from pg_attribute a
            join pg_class c on c.oid = a.attrelid
            join pg_namespace n on n.oid = c.relnamespace
            left join pg_attrdef d on d.adrelid = a.attrelid and d.adnum = a.attnum
          where n.nspname in ('public', 'mod_ci_a', 'mod_ci_b')
            and c.relkind in ('r', 'p', 'v', 'm')
            and a.attnum > 0 and not a.attisdropped;

          select 'policy ' || n.nspname || '.' || c.relname || '.' || p.polname
                 || ' ' || coalesce(pg_get_expr(p.polqual, p.polrelid), '-')
          from pg_policy p join pg_class c on c.oid = p.polrelid
            join pg_namespace n on n.oid = c.relnamespace
          where n.nspname in ('public', 'mod_ci_a', 'mod_ci_b');

          select 'index ' || indexdef from pg_indexes
          where schemaname in ('public', 'mod_ci_a', 'mod_ci_b');

          select 'constraint ' || n.nspname || '.' || c.relname || '.' || o.conname
                 || ' ' || pg_get_constraintdef(o.oid)
          from pg_constraint o join pg_class c on c.oid = o.conrelid
            join pg_namespace n on n.oid = c.relnamespace
          where n.nspname in ('public', 'mod_ci_a', 'mod_ci_b');

          select 'routine ' || p.oid::regprocedure::text || ' owner=' || pg_get_userbyid(p.proowner)
          from pg_proc p join pg_namespace n on n.oid = p.pronamespace
          where n.nspname in ('public', 'mod_ci_a', 'mod_ci_b');

          select 'type ' || t.oid::regtype::text || ' labels=' || coalesce(
                   (select string_agg(e.enumlabel, ',' order by e.enumsortorder)
                    from pg_enum e where e.enumtypid = t.oid), '-')
          from pg_type t join pg_namespace n on n.oid = t.typnamespace
          where n.nspname in ('public', 'mod_ci_a', 'mod_ci_b') and t.typtype = 'e';

          select format(
            'select %L || '' rows='' || count(*) || '' sha='' || coalesce(md5(string_agg(h, '''' order by h)), ''empty'') from (select md5(t::text) as h from %s t) s',
            'data ' || n.nspname || '.' || c.relname,
            format('%I.%I', n.nspname, c.relname))
          from pg_class c join pg_namespace n on n.oid = c.relnamespace
          where n.nspname in ('public', 'mod_ci_a', 'mod_ci_b') and c.relkind in ('r', 'p')
          \gexec

          -- A sequence restored at 1 hands the next insert a primary key that is already taken.
          select format('select %L || '' last='' || last_value || '' called='' || is_called from %s',
                        'sequence ' || n.nspname || '.' || c.relname,
                        format('%I.%I', n.nspname, c.relname))
          from pg_class c join pg_namespace n on n.oid = c.relnamespace
          where n.nspname in ('public', 'mod_ci_a', 'mod_ci_b') and c.relkind = 'S'
          \gexec
          SQL

          census() { # census <inst|newh> <outfile>
            "$1" exec -T postgres psql -U kern -d kern -tA -v ON_ERROR_STOP=1 -f - < "$W/census.sql" \
              | LC_ALL=C sort > "$2"
          }
          census inst "$W/census.source"
          echo "✔ seeded: $(grep -c . "$W/census.source") catalogue and data facts"

          # ------------------------------------------------ the backup, run as it ships

          ( cd "$I" && COMPOSE_PROJECT_NAME=kern-drill-src ./kern-backup.sh ) > "$W/backup.out" 2>&1 \
            || { echo "::error::kern-backup.sh failed"; cat "$W/backup.out"; exit 1; }
          D=$(ls -1d "$I"/backups/[0-9]*-[0-9]*/ | head -1); D="${D%/}"
          [ -s "$D/database.dump" ] || { echo "::error::no dump in $D"; ls -l "$D"; exit 1; }
          [ -f "$D/RESTORE.txt" ] || { echo "::error::no RESTORE.txt in $D"; ls -l "$D"; exit 1; }

          # Two opposite requirements on the same directory, and the blanket `chmod -R go-rwx`
          # satisfied only the first. .env holds every secret this instance has and must stay
          # private; postgres-init/ is read by the *Postgres container* on the restored host, which
          # runs as uid 999, so a file that chmod left at 0600 makes its entrypoint exit 1 with
          # "Permission denied" and the restored database never starts.
          mode() { stat -c '%a' "$1" 2>/dev/null || stat -f '%Lp' "$1"; }
          # Both trailing digits, not one. `*0)` tested only the world bit, so 0640 and 0660 passed
          # while the message beside them said "another user on this host can read every secret" —
          # which is precisely what group-readable means. Measured: with the script's `go-rwx`
          # changed to `o-rwx`, .env was published `-rw-r-----` and this whole drill went green
          # printing "✔ .env private". Nothing is broken today, because the shipped script does
          # `go-rwx` and produces 0600; the point is that a regression to group-readable is the one
          # thing this assertion exists to catch and it was the one thing it could not see.
          case "$(mode "$D/.env")" in
            *00) ;;
            *) echo "::error::.env in the backup is $(mode "$D/.env") — another user on this host can read every secret"; exit 1 ;;
          esac
          # The directory as well as the files: at 0700 the container cannot even list the mount,
          # which is what run 34039806831 showed — "ls: cannot open directory
          # '/docker-entrypoint-initdb.d/': Permission denied", on a loop, because it restarts.
          # A directory needs r AND x: 0704 and 0744 pass a read-only test and still cannot be
          # traversed, so the container lists the names and cannot open the files — the same failure
          # this assertion was written for, one step further in. `chmod go+rX` never produces that,
          # so it is latent rather than live, but the test should not accept a mode the product
          # would be broken by.
          for f in "$D/postgres-init" "$D"/postgres-init/*.sql; do
            want='*[4567]'; [ -d "$f" ] && want='*[57]'
            # shellcheck disable=SC2254 # the pattern is chosen above, deliberately unquoted
            case "$(mode "$f")" in
              $want) ;;
              *) echo "::error::$f is $(mode "$f") — the Postgres container on the restored host cannot read it"; exit 1 ;;
            esac
          done
          echo "✔ backup published $(basename "$D"): .env private, postgres-init readable"

          # ------------------------------------------------ follow RESTORE.txt

          python3 - "$D/RESTORE.txt" "$W/steps" <<'PY'
          import re, shlex, sys

          body = open(sys.argv[1]).read().split("To restore onto an empty host", 1)[1]

          # A step is `<n>. ` at the margin, its prose wraps at three spaces, and its commands are
          # indented past that. A line back at the margin ends the list.
          steps, num = {}, None
          for line in body.splitlines():
              if re.match(r"^(\d+)\. ", line):
                  num = int(line.split(".", 1)[0]); steps[num] = []
              elif num is None or not line.strip():
                  continue
              elif line.startswith("       "):
                  steps[num].append(line.rstrip())
              elif not line.startswith("   "):
                  num = None

          # Two things continue a command: a trailing backslash, and a quote that is still open.
          # The mirror in step 4 is both — `\` after its first line, an unclosed `-c "` after the
          # second — so a joiner that only knows about backslashes cuts it into three fragments.
          def commands(lines):
              buf = ""
              for raw in lines:
                  line = raw.strip()
                  buf = (buf + " " + (line[:-1] if line.endswith("\\") else line)).strip()
                  if line.endswith("\\"):
                      continue
                  try:
                      shlex.split(buf)
                  except ValueError:
                      continue          # a quote is still open
                  yield buf
                  buf = ""
              assert not buf, f"unterminated command: {buf}"

          out = [f"{n}\t{c}" for n in sorted(steps) for c in commands(steps[n])]

          # A step this parser cannot see is a step nothing runs, and the drill would report a
          # clean pass having skipped it — which is exactly what it did the first time it was
          # written, to the two steps whose prose wraps onto a second line. So the shape of the
          # file is asserted rather than hoped for.
          found = sorted({int(l.split("\t")[0]) for l in out})
          assert found == [1, 2, 3, 4, 5], f"RESTORE.txt steps carrying commands: {found}, expected 1..5"
          open(sys.argv[2], "w").write("\n".join(out) + "\n")
          PY
          cat "$W/steps"

          # Step 1 is done here rather than run, and step 5 is not exercised at all. Both are named
          # so the coverage this claims is the coverage it has:
          #   1  it only fetches the maintenance scripts into the new directory; the files it tells
          #      you to copy are already here, put there by the backup this drill just took.
          #   5  `docker compose up -d` needs this release's five service images out of GHCR.
          # Everything between them — the database and the object storage — is run for real.
          cp "$D/.env" "$D/docker-compose.yml" "$D/Caddyfile" "$D/livekit.yaml" "$N/"
          cp -R "$D/postgres-init" "$N/postgres-init"
          cp "$D/database.dump" "$N/database.dump"
          cp -R "$D/files" "$N/files"

          AK=$(grep -E '^S3_ACCESS_KEY=' "$N/.env" | cut -d= -f2- | tr -d "'\"")
          SK=$(grep -E '^S3_SECRET_KEY=' "$N/.env" | cut -d= -f2- | tr -d "'\"")

          while IFS=$'\t' read -r step cmd; do
            case "$step" in 1|5) continue ;; esac
            cmd=${cmd//<S3_ACCESS_KEY>/$AK}
            cmd=${cmd//<S3_SECRET_KEY>/$SK}
            echo "--- RESTORE.txt step $step: $cmd"
            ( cd "$N" && COMPOSE_PROJECT_NAME=kern-drill-dst sh -c "$cmd" ) > "$W/step.out" 2> "$W/step.err" || {
              echo "::error::RESTORE.txt step $step did not work: $cmd"
              cat "$W/step.out" "$W/step.err"
              echo "--- what the new host looks like ---"
              ls -la "$N" "$N/postgres-init" || true
              newh ps -a || true
              newh logs --tail 40 postgres || true
              exit 1; }
            # pg_restore prints a refused object and carries on, so the exit status is not the whole
            # answer; `mc` says <ERROR> the same way.
            if grep -qiE 'error:|<error>' "$W/step.err"; then
              echo "::error::RESTORE.txt step $step reported an error"; cat "$W/step.err"; exit 1
            fi
          done < "$W/steps"
          echo "✔ every command in RESTORE.txt ran clean"

          # ------------------------------------------------ is it the same database?

          census newh "$W/census.restored"
          if ! diff -u "$W/census.source" "$W/census.restored" > "$W/census.diff"; then
            echo "::error::the restored database is not the database that was backed up"
            cat "$W/census.diff"; exit 1
          fi
          echo "✔ $(grep -c . "$W/census.source") facts identical across the dump"

          newh run --rm --no-deps --entrypoint /bin/sh minio-init -c "
            mc alias set dst http://minio:9000 '$AK' '$SK' >/dev/null &&
            mc cat dst/kern/ws1/a.txt && mc cat dst/kern/ws2/deep/b.bin" > "$W/objects" 2>/dev/null
          printf 'attachment one\nbinary\000payload' > "$W/objects.expected"
          cmp "$W/objects" "$W/objects.expected" \
            || { echo "::error::the object storage mirror did not come back"; exit 1; }
          echo "✔ object storage restored, byte for byte"

          # A comparison that has never reported a difference is not known to be able to. One row
          # goes, and the diff that just passed has to fail.
          newh exec -T postgres psql -U kern -d kern -q -c "delete from mod_ci_b.notes where id = 7" >/dev/null
          census newh "$W/census.sabotaged"
          if diff -q "$W/census.source" "$W/census.sabotaged" >/dev/null; then
            echo "::error::a row was deleted from the restored database and the census did not notice"
            exit 1
          fi
          diff "$W/census.source" "$W/census.sabotaged" | head -4 || true
          echo "✔ the census catches a single missing row"

      # kern-auto-update.service is Type=oneshot, so any non-zero status paints the unit red. The
      # CLI recorded the outcome before the stack-file verdict and then exited 1 for a blocked
      # stack, so the panel showed the release applied while systemd showed a failed unit — every
      # night, for as long as one file stayed edited. An operator who sees that stops reading it.
      - name: A blocked stack file warns the timer, and fails a person's shell
        run: |
          set -euo pipefail
          W=$(mktemp -d); mkdir -p "$W/bin" "$W/upstream/v0.0.1" "$W/upstream/v0.0.2"

          cat > "$W/bin/docker" <<'STUB'
          #!/usr/bin/env bash
          # A healthy instance's answer to every compose command an upgrade issues, with each call
          # appended to $KERN_TEST_LOG so the test can assert on what the instance was told.
          ARGS="$*"
          printf '%s\n' "$ARGS" >> "${KERN_TEST_LOG:-/dev/null}"
          case "$ARGS" in
            *"updates-cli.js plan"*) printf '{"shouldUpgrade": true, "version": "0.0.2", "reason": "in the window"}\n'; exit 0 ;;
            *"ps --format"*) printf 'ghcr.io/kernaio/shell:0.0.2\n'; exit 0 ;;
            *pg_database_size*) printf '10485760\n'; exit 0 ;;
            *pg_dump*) printf 'PGDMP'; head -c 2000 /dev/zero | tr '\0' 'x'; exit 0 ;;
            *"/api/health"*) printf '0.0.2\n'; exit 0 ;;
          esac
          exit 0
          STUB
          chmod +x "$W/bin/docker"

          cp -R selfhost "$W/upstream/v0.0.1/selfhost"
          cp -R selfhost "$W/upstream/v0.0.2/selfhost"
          printf '\n# release 0.0.2 added this line\n' >> "$W/upstream/v0.0.2/selfhost/Caddyfile"

          new_instance() { # new_instance <dir> — with a Caddyfile the operator has edited
            rm -rf "$1"; mkdir -p "$1"
            cp -R "$W/upstream/v0.0.1/selfhost/." "$1/"
            cp selfhost/kern-upgrade.sh "$1/kern-upgrade.sh"; chmod +x "$1/kern-upgrade.sh"
            printf "KERN_VERSION='0.0.1'\nPOSTGRES_USER='kern'\nPOSTGRES_DB='kern'\nKERN_DB_APP_PASSWORD='x'\nMAIL_WEBHOOK_TOKEN='x'\n" > "$1/.env"
            printf '\n# the operator added a redirect here\n' >> "$1/Caddyfile"
          }

          upgrade() { # upgrade <dir> [args...]
            : > "$W/calls"
            ( cd "$1" && shift
              PATH="$W/bin:$PATH" KERN_TEST_LOG="$W/calls" KERN_RAW_BASE="$W/upstream" \
                ./kern-upgrade.sh "$@" ) > "$W/out" 2>&1
          }

          echo "== the timer's run: a warning, not a failed unit =="
          I="$W/i"; new_instance "$I"
          status=0; upgrade "$I" --auto || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::--auto exited $status for an upgrade it recorded as successful — a red unit every night"
            cat "$W/out"; exit 1
          fi
          grep -q 'NOT brought forward' "$W/out" \
            || { echo "::error::the blocked file was not reported"; cat "$W/out"; exit 1; }
          grep -q "updates-cli.js record 0.0.2 ok" "$W/calls" \
            || { echo "::error::the outcome the panel shows was not recorded"; cat "$W/calls"; exit 1; }
          if grep -q "updates-cli.js record 0.0.2 failed" "$W/calls"; then
            echo "::error::a blocked stack file was recorded as a failed upgrade — the timer would stand down for good"
            exit 1
          fi
          # The edit is still there tomorrow night, so the run after this one must behave the same.
          grep -q 'the operator added a redirect' "$I/Caddyfile" \
            || { echo "::error::the operator's edit was overwritten"; exit 1; }
          echo "✔ exit 0, recorded ok, and the operator was told what is left to merge"

          echo "== a person at a terminal still gets a non-zero status =="
          I="$W/i"; new_instance "$I"
          if upgrade "$I" 0.0.2; then
            echo "::error::an interactive run reported success for an undelivered upgrade"; cat "$W/out"; exit 1
          fi
          if grep -q 'updates-cli.js record' "$W/calls"; then
            echo "::error::a run that is not --auto recorded an outcome"; cat "$W/calls"; exit 1
          fi
          echo "✔ interactive runs keep their exit 1"
          rm -rf "$W"

      - name: Every variable the compose file reads is in .env.example
        working-directory: selfhost
        run: |
          set -euo pipefail
          missing=0
          for var in $(grep -ohE '\$\{[A-Z_][A-Z0-9_]*' docker-compose.yml | sed 's/^\${//' | sort -u); do
            # PWD is the shell's, not the operator's: the updater mounts `${KERN_DIR:-${PWD}}` so a
            # host without KERN_DIR still resolves its own directory. Nothing to document.
            [ "$var" = "PWD" ] && continue
            grep -qE "^${var}=" .env.example || { echo "::error::${var} is not in .env.example"; missing=1; }
          done
          [ "$missing" -eq 0 ] && echo "✔ every variable documented"
